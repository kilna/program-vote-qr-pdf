[project]
name = "program-vote-qr-pdf"
version = "0.1.0"
description = "Overlay unique voting QR codes onto a source program PDF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5.0",
  "reportlab>=4.0",
  "segno>=1.6",
]

[project.scripts]
program-vote-qr = "program_vote_qr.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/program_vote_qr"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
